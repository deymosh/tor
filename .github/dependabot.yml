# Proposes monthly PRs for the Debian base digest and the workflow actions.
# Tor itself is an apt package pin (TOR_VERSION) that Dependabot cannot
# track; the Bump Tor workflow (bump-tor.yml) bumps it instead.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
